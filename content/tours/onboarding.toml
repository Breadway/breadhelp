# Live guided tour steps, walked by breadhelp-tour. Phase A validation subset,
# just enough to prove the spotlight/must-do engine end-to-end (breadbar's
# plain observe-only highlight, breadbox's real openlayer detection) before
# authoring the full app-by-app tour. See breadhelp-tour.lua for the
# `--tour-event` ids this matches against.

[[step]]
id = "welcome"
title = "Welcome to BOS"
body = "This is a quick, hands-on tour of your desktop. Instead of just describing things, we'll point at the real thing on screen as we go."

[[step]]
id = "breadbar"
title = "Breadbar"
body = "This bar across the top of your screen always shows your workspace, the time, and quick status for network, volume, and battery. Click any icon on it to see more."
target_namespace = "breadbar"

[[step]]
id = "breadbox"
title = "Opening apps"
body = "Everything in BOS opens from breadbox. Open it, start typing an app's name, and press Enter to launch it."
target_namespace = "breadbox"
launch = "breadbox"
success_event = "layer-closed:breadbox"
keybind = "super + space"
confirmed_text = "Nice work. That was the real launcher, and you just used it."

[[step]]
id = "finish"
title = "You're all set"
body = "Those are the basics. Help is one key away whenever you want more: guides, keybinds and one-click fixes."

[[step.shortcuts]]
label = "Every keybind, any time"
keybind = "super + /"

[[step.shortcuts]]
label = "Open any app"
keybind = "super + space"

[[step.shortcuts]]
label = "Settings"
keybind = "super + ,"
