# breadhelp is three crates:
#
# - `breadhelp-core`: content, keybinds, state and system services. No UI
#   toolkit, so both binaries below can link it.
# - `breadhelp` (app/): the help window, Tauri + the Svelte frontend in
#   frontend/. Same stack as bos-settings, so the two look like one desktop.
# - `breadhelp-tour` (crates/breadhelp-tour): the live guided tour overlay,
#   native GTK4 + gtk4-layer-shell. Tauri's Linux backend is GTK3, and GTK3
#   and GTK4 cannot share a process, so the overlay is its own binary.
#
# The tour is deliberately NOT a member here: it has its own workspace and
# Cargo.lock. Cargo unifies features across one build, so with both binaries
# in one workspace a plain `cargo build` turned on bread-theme's `gtk`
# feature for the Tauri binary too, linking GTK4 into it, and it aborted at
# start ("GTK 2/3 symbols detected"). Build it with
# `cargo build --manifest-path crates/breadhelp-tour/Cargo.toml`.
[workspace]
resolver = "2"
members = ["crates/breadhelp-core", "app"]
exclude = ["crates/breadhelp-tour"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
breadhelp-core = { path = "crates/breadhelp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Non-destructive state editing (mirrors bos-settings/src/config/mod.rs).
toml_edit = "0.22"
anyhow = "1"
bread-utils = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", tag = "v0.7.2", features = ["toml", "bread-client"] }
# Shared ecosystem theming: the same wallpaper palette bos-settings and the
# GTK bread apps use, so this looks like part of the same desktop.
bread-theme = { git = "https://git.breadway.dev/Breadway/bread-ecosystem", tag = "v0.8.0" }
