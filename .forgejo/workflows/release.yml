name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: [self-hosted, hestia]
    steps:
      - name: checkout
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          git clone --branch "${GITHUB_REF_NAME}" --depth 1 \
            "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" src

      - name: check promotion through beta
        run: |
          set -euo pipefail
          SRC_DIR="src"
          COMMIT="$(git -C "${SRC_DIR}" rev-parse HEAD)"
          ECO_DIR="$(mktemp -d /tmp/bread-promotion-XXXXXX)"
          trap 'rm -rf -- "${ECO_DIR}"' EXIT
          git clone --depth 1 https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECO_DIR}"
          bash "${ECO_DIR}/scripts/check-promotion.sh" \
            "${GITHUB_REPOSITORY}" "breadhelp" "${GITHUB_REF_NAME}" "${COMMIT}"

      - name: build
        run: |
          set -euo pipefail
          if [ ! -f src/ci/build.sh ]; then
            echo "::error::ci/build.sh is missing: bakery release builds must go through the shared CI wrapper"
            exit 1
          fi
          cd src && bash ci/build.sh bash ci/build-all.sh --locked || {
            echo "::error::cargo build --release --locked failed. If Cargo.lock drifted, update and commit it; do not drop --locked."
            exit 1
          }

      - name: test
        run: cd src && bash ci/build.sh bash ci/test-all.sh --locked

      - name: prepare artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/breadhelp/${VERSION}"
          mkdir -p "${PKG_DIR}"
          for bin in breadhelp breadhelp-tour; do
            cp "src/target/release/${bin}" "${PKG_DIR}/${bin}-x86_64"
            strip "${PKG_DIR}/${bin}-x86_64"
            sha256sum "${PKG_DIR}/${bin}-x86_64" | awk '{print $1}' \
              > "${PKG_DIR}/${bin}-x86_64.sha256"
          done
          cp src/packaging/breadhelp.desktop "${PKG_DIR}/"
          cp src/LICENSE "${PKG_DIR}/"
          tar czf "${PKG_DIR}/content.tar.gz" -C src content
          cp src/bakery.toml "${PKG_DIR}/bakery.toml"
          ln -sfn "${VERSION}" "/srv/breadway-dl/breadhelp/latest"

      - name: regenerate index.json
        env:
          MINISIGN_SEC_KEY: ${{ secrets.BAKERY_MINISIGN_SEC_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SEC_KEY:-}" ]; then
            echo "::error::BAKERY_MINISIGN_SEC_KEY_PATH secret not set: refusing to regenerate index.json unsigned (would leave a stale signature mismatched against fresh content and break bakery for everyone)"
            exit 1
          fi
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-ci-XXXXXX)"
          git clone https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          bash "${ECOSYSTEM_CI_DIR}/scripts/gen-index.sh"
          rm -rf "${ECOSYSTEM_CI_DIR}"

      - name: upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_DIR="/srv/breadway-dl/breadhelp/${VERSION}"
          gh release create "${GITHUB_REF_NAME}" --repo Breadway/breadhelp \
            --title "breadhelp v${VERSION}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" --repo Breadway/breadhelp \
            "${PKG_DIR}/breadhelp-x86_64" \
            "${PKG_DIR}/breadhelp-x86_64.sha256" \
            "${PKG_DIR}/breadhelp-tour-x86_64" \
            "${PKG_DIR}/breadhelp-tour-x86_64.sha256" \
            --clobber
